name: Release Windows (SignPath)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        run: npm run build:win

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        id: upload-unsigned
        with:
          name: unsigned-windows
          path: |
            dist/DevBox-Pro-Setup-*.exe
            dist/DevBox-Pro-*.exe

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: 'devbox-pro'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-output'

      - name: Update latest.yml for signed installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setup = Get-ChildItem ./signed-output/DevBox-Pro-Setup-*.exe | Select-Object -First 1
          if ($setup -and (Test-Path ./dist/latest.yml)) {
            $bytes = [System.IO.File]::ReadAllBytes($setup.FullName)
            $sha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
            $size = $setup.Length
            node -e "
              const fs = require('fs');
              let yml = fs.readFileSync('dist/latest.yml', 'utf8');
              yml = yml.replace(/sha512:\s*.+/g, 'sha512: ' + process.argv[1]);
              yml = yml.replace(/size:\s*\d+/g, 'size: ' + process.argv[2]);
              fs.writeFileSync('dist/latest.yml', yml);
            " "$sha512" "$size"
          }

      - name: Extract release notes from RELEASE.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $content = Get-Content -Path RELEASE.md -Raw -Encoding UTF8
          $marker = "## 🆕 What's New"
          $idx = $content.IndexOf($marker)
          if ($idx -ge 0) {
            $notes = $content.Substring($idx)
          } else {
            $notes = $content
          }
          Set-Content -Path ./release-notes.md -Value $notes -Encoding UTF8 -NoNewline

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DevBox Pro ${{ github.ref_name }}
          body_path: ./release-notes.md
          files: |
            ./signed-output/*
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
