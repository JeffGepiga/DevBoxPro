name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        run: npm run build:win

      - name: Extract release notes from RELEASE.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $content = Get-Content -Path RELEASE.md -Raw -Encoding UTF8
          $marker = "## 🆕 What's New"
          $idx = $content.IndexOf($marker)
          if ($idx -ge 0) {
            $notes = $content.Substring($idx)
          } else {
            $notes = $content
          }
          Set-Content -Path ./release-notes.md -Value $notes -Encoding UTF8 -NoNewline

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DevBox Pro ${{ github.ref_name }}
          body_path: ./release-notes.md
          files: |
            dist/DevBox-Pro-Setup-*.exe
            dist/DevBox-Pro-*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
